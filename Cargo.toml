[package]
name = "agis"
version = "0.5.0"
edition = "2021"
description = "A Spartan protocol server"
authors = ["Nathan Fisher"]
repository = "https://codeberg.org/jeang3nie/agis"
keywords = ["networking", "spartan"]
categories = ["network-programming"]
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
epoch = { git = "https://git.hitchhiker-linux.org/jeang3nie/epoch-rs.git" }
getopts = "0.2"
libc = "0.2"
once_cell = "1.15"
osrand = "0.2.1"
ron = "0.8"
tree_magic_mini = "3.0"
urlencoding = "2.1"

[dependencies.ctrlc]
version = "3.2"
features = ["termination"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[profile.release]
codegen-units = 1
lto = true
strip = true
